<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Cổng Trời Đông Giang</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #014321;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Container chính của Poster */
        .poster-container {
            position: relative;
            width: 100%;
            max-width: 500px; /* Tỉ lệ chuẩn cho điện thoại */
            margin: auto;
            line-height: 0;
        }

        /* Ảnh nền Poster */
        .bg-img {
            width: 100%;
            height: auto;
            display: block;
            z-index: 1;
        }

        /* --- KHU VỰC VÒNG XOAY (ĐÃ CHỈNH KHỚP 100%) --- */
        .wheel-area {
            position: absolute;
            top: 61.2%;   /* Tọa độ tâm dọc chuẩn */
            left: 50%;    /* Tọa độ tâm ngang chuẩn */
            width: 86%;   /* Độ to đã được tăng để khít khung vàng */
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        /* Hình ảnh vòng xoay (phần sẽ xoay) */
        .wheel-img {
            width: 100%;
            height: auto;
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
            display: block;
        }

        /* Nút START ở giữa */
        .start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28%; /* Độ to nút quay hài hòa */
            cursor: pointer;
            z-index: 10;
            transition: transform 0.1s;
        }
        
        .start-btn:active { transform: translate(-50%, -50%) scale(0.9); }

        /* --- POPUP CHÚC MỪNG (MODAL) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            width: 80%;
            max-width: 320px;
            padding: 30px 20px;
            border-radius: 25px;
            border: 5px solid #ffd700;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            animation: popup 0.5s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        @keyframes popup { from { transform: scale(0); } to { transform: scale(1); } }

        .modal-content h2 { color: #d42020; margin: 0 0 10px; font-size: 26px; }
        .modal-content p { color: #333; font-size: 18px; margin-bottom: 25px; line-height: 1.5; font-weight: bold;}
        
        .close-btn {
            background: linear-gradient(180deg, #ffcc00, #f39200);
            color: white; border: none; padding: 12px 35px; border-radius: 50px;
            font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Ảnh nền Poster -->
        <img src="nen-back.jpg" class="bg-img">

        <!-- Khu vực vòng xoay -->
        <div class="wheel-area">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <!-- Nút quay -->
            <img src="nut-quay.png" class="start-btn" onclick="startSpin()">
        </div>
    </div>

    <!-- Cửa sổ báo kết quả -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2>XIN CHÚC MỪNG!</h2>
            <p id="prize-text"></p>
            <button class="close-btn" onclick="closeModal()">Nhận quà ngay</button>
        </div>
    </div>

    <script>
        let isSpinning = false;
        let currentRotation = 0;
        
        /* 
           THIẾT LẬP TỈ LỆ VÀ QUÀ TẶNG
           Dựa trên bảng tỉ lệ bạn đã cung cấp
        */
        const prizes = [
            { name: "TÚI VẢI CỔNG TRỜI 👜", weight: 20 },
            { name: "VOUCHER MIỄN PHÍ VÉ THAM QUAN 🎫", weight: 15 },
            { name: "TÚI CÓI ĐÔNG GIANG 🧺", weight: 10 },
            { name: "STICKER CỔNG TRỜI 🌟", weight: 20 },
            { name: "VOUCHER GIẢM 100K 💸", weight: 15 },
            { name: "QUẠT CẦM TAY XINH XẮN 🪭", weight: 20 }
        ];

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;

            // 1. Tính toán tỉ lệ trúng
            let random = Math.floor(Math.random() * 100);
            let cumulativeWeight = 0;
            let prizeIndex = 0;

            for (let i = 0; i < prizes.length; i++) {
                cumulativeWeight += prizes[i].weight;
                if (random < cumulativeWeight) {
                    prizeIndex = i;
                    break;
                }
            }

            // 2. Tính toán góc quay (Vòng có 6 ô, mỗi ô 60 độ)
            const segmentDeg = 60;
            // Tính góc dừng để kim ở đỉnh (12h) chỉ đúng tâm ô đã chọn
            const targetDeg = (360 - (prizeIndex * segmentDeg)); 
            
            // Quay ít nhất 5 vòng + bù trừ góc hiện tại
            const totalSpin = 1800 + targetDeg;
            currentRotation += totalSpin - (currentRotation % 360); 
            
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // 3. Hiện Popup sau khi quay xong (5 giây)
            setTimeout(() => {
                isSpinning = false;
                showModal(prizes[prizeIndex].name);
            }, 5000);
        }

        function showModal(name) {
            document.getElementById('prize-text').innerHTML = "Bạn đã may mắn nhận được:<br><span style='color:#014321;'>" + name + "</span>";
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
