<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Cổng Trời Đông Giang</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; /* Luôn bằng chiều cao màn hình */
            background-color: #014321;
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Không cho cuộn trang */
        }

        /* Container tự co giãn để luôn thấy hết Poster trên mọi màn hình */
        .poster-container {
            position: relative;
            height: 98vh; /* Poster chiếm tối đa 98% chiều cao màn hình */
            width: auto;
            aspect-ratio: 1 / 2; /* Giữ tỉ lệ poster dọc */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-img {
            height: 100%; /* Ảnh nền cao bằng container */
            width: auto;
            display: block;
            z-index: 1;
        }

        /* --- VÒNG XOAY (Đã nhích xuống 61.7%) --- */
        .wheel-area {
            position: absolute;
            top: 61.7%; /* Đã nhích xuống thêm một tí theo yêu cầu */
            left: 50%;
            width: 89.2%; /* Khớp khít viền vàng */
            transform: translate(-50%, -50%);
            z-index: 2;
            line-height: 0;
        }

        .wheel-img {
            width: 100%;
            height: auto;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .start-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32%; 
            cursor: pointer;
            z-index: 10;
        }

        /* --- BẢNG CHÚC MỪNG NỀN TRẮNG (MODAL) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #ffffff; /* Nền trắng như ảnh 3 */
            width: 85%;
            max-width: 350px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .modal-content h2 { color: #d42020; margin-top: 0; font-size: 22px; }
        .modal-content p { font-size: 17px; margin: 15px 0; line-height: 1.5; }

        .zalo-btn {
            display: inline-block;
            background-color: #c1f0c1; /* Xanh lá nhạt */
            color: #004d26;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            margin-top: 10px;
            border: 1px solid #8ed18e;
        }

        /* Hiệu ứng hết lượt */
        .out-of-turns {
            filter: grayscale(1);
            cursor: not-allowed !important;
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Ảnh nền -->
        <img src="nen-back.jpg" class="bg-img">

        <!-- Vòng xoay -->
        <div class="wheel-area">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <img src="nut-quay.png" class="start-btn" id="spin-button" onclick="startSpin()">
        </div>
    </div>

    <!-- Popup nền trắng -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2 id="modal-title">CỔNG TRỜI ĐÔNG GIANG</h2>
            <p id="prize-text"></p>
            <!-- Thay link Zalo của bạn vào đây -->
            <a href="https://zalo.me/YOUR_PHONE_NUMBER" target="_blank" class="zalo-btn">LIÊN HỆ ZALO NHẬN QUÀ</a>
        </div>
    </div>

    <script>
        let isSpinning = false;
        let currentRotation = 0;
        
        // KIỂM TRA LƯỢT QUAY (Giới hạn 2 lượt)
        let spinCount = parseInt(localStorage.getItem('spin_count_donggiang')) || 0;

        // Nếu đã hết lượt ngay từ đầu
        if (spinCount >= 2) {
            document.getElementById('spin-button').classList.add('out-of-turns');
        }

        const prizes = [
            { name: "TÚI VẢI ĐÔNG GIANG 👜" },           // Ô 1 (12h)
            { name: "VOUCHER MIỄN PHÍ VÉ THAM QUAN 🎫" }, // Ô 2
            { name: "TÚI CÓI ĐÔNG GIANG 🧺" },           // Ô 3
            { name: "STICKER CỔNG TRỜI ĐÔNG GIANG 🌟" }, // Ô 4
            { name: "VOUCHER GIẢM 100K 💸" },            // Ô 5
            { name: "QUẠT CẦM TAY XINH XẮN 🪭" }         // Ô 6
        ];

        function startSpin() {
            if (isSpinning) return;

            // Kiểm tra giới hạn lượt quay
            if (spinCount >= 2) {
                alert("Bạn đã sử dụng hết 2 lượt quay may mắn!");
                return;
            }

            isSpinning = true;

            // Tính toán quà tặng ngẫu nhiên (hoặc theo tỉ lệ % bạn muốn)
            let prizeIndex = Math.floor(Math.random() * prizes.length);

            // Tính góc quay dừng ở bên Phải (mũi tên hướng 3 giờ)
            let stopDegree = 90 - (prizeIndex * 60) - 30;
            let totalSpin = (360 * 10) + stopDegree; 
            currentRotation += totalSpin - (currentRotation % 360) + (stopDegree < (currentRotation % 360) ? 360 : 0);
            
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinCount++;
                localStorage.setItem('spin_count_donggiang', spinCount);
                
                if (spinCount >= 2) {
                    document.getElementById('spin-button').classList.add('out-of-turns');
                }

                showModal(prizes[prizeIndex].name);
            }, 5200);
        }

        function showModal(name) {
            document.getElementById('prize-text').innerHTML = "Chúc mừng bạn đã nhận được:<br><b>" + name + "</b>";
            document.getElementById('modal').style.display = 'flex';
        }

        // Đóng modal khi bấm ra ngoài hoặc nút nhận quà
        window.onclick = function(event) {
            if (event.target == document.getElementById('modal')) {
                document.getElementById('modal').style.display = 'none';
            }
        }
    </script>
</body>
</html>
