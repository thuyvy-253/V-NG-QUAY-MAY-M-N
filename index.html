<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Cổng Trời Đông Giang</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #014321;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .poster-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: auto;
            line-height: 0;
        }

        .bg-img { width: 100%; height: auto; display: block; z-index: 1; }

        /* --- CĂN CHỈNH VỊ TRÍ VÒNG XOAY --- */
        .wheel-area {
            position: absolute;
            /* TỌA ĐỘ NÀY ĐÃ ĐƯỢC TINH CHỈNH TỪNG MILIMET */
            top: 61.15%; 
            left: 50%;
            width: 88.2%; /* Tỉ lệ này giúp khít bóng đèn LED */
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .wheel-img {
            width: 100%;
            height: auto;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
            display: block;
        }

        .start-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32%; 
            cursor: pointer;
            z-index: 10;
        }

        /* --- GIAO DIỆN CHÚC MỪNG --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #1a1a1a;
            width: 85%;
            max-width: 350px;
            padding: 30px 20px;
            border-radius: 20px;
            border: 3px solid #ffcc00;
            text-align: center;
            color: white;
            box-shadow: 0 0 20px #ffcc00;
            animation: popup 0.5s ease-out;
        }

        @keyframes popup { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-content h2 { color: #ff4d4d; margin: 0; font-size: 24px; text-transform: uppercase; }
        .modal-content p { font-size: 18px; margin: 20px 0; line-height: 1.5; }
        
        .close-btn {
            background: linear-gradient(to bottom, #ffcc00, #f39200);
            color: black; border: none; padding: 12px 30px; border-radius: 50px;
            font-weight: bold; cursor: pointer; font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <img src="nen-back.jpg" class="bg-img">
        <div class="wheel-area">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <img src="nut-quay.png" class="start-btn" onclick="startSpin()">
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2>XIN CHÚC MỪNG!</h2>
            <p id="prize-text"></p>
            <button class="close-btn" onclick="closeModal()">NHẬN QUÀ NGAY</button>
        </div>
    </div>

    <script>
        let isSpinning = false;
        let currentRotation = 0;
        
        /* 
           DANH SÁCH QUÀ THEO ĐÚNG VỊ TRÍ TRÊN HÌNH (RẤT QUAN TRỌNG)
           Thứ tự này tính từ ô trên cùng (12 giờ) và đi xuôi chiều kim đồng hồ:
        */
        const prizes = [
            { name: "TÚI VẢI ĐÔNG GIANG 👜", weight: 20 },           // Ô 1 (Đỉnh)
            { name: "VOUCHER MIỄN PHÍ VÉ THAM QUAN 🎫", weight: 15 }, // Ô 2
            { name: "TÚI CÓI ĐÔNG GIANG 🧺", weight: 10 },           // Ô 3
            { name: "STICKER CỔNG TRỜI 🌟", weight: 20 },            // Ô 4 (Đáy)
            { name: "VOUCHER GIẢM 100K 💸", weight: 15 },            // Ô 5
            { name: "QUẠT CẦM TAY XINH XẮN 🪭", weight: 20 }         // Ô 6
        ];

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;

            // 1. Tính tỉ lệ trúng
            let random = Math.floor(Math.random() * 100);
            let cumulativeWeight = 0;
            let prizeIndex = 0;
            for (let i = 0; i < prizes.length; i++) {
                cumulativeWeight += prizes[i].weight;
                if (random < cumulativeWeight) { prizeIndex = i; break; }
            }

            // 2. TÍNH TOÁN GÓC QUAY ĐỂ MŨI TÊN (BÊN PHẢI - 90 độ) CHỈ ĐÚNG Ô
            // Mỗi ô là 60 độ. Mũi tên ở vị trí 90 độ.
            // Công thức: 90 - (vị trí ô * 60) - 30 (để vào giữa ô)
            let stopDegree = 90 - (prizeIndex * 60) - 30;
            
            // Quay ít nhất 8 vòng cho đẹp
            let totalSpin = (360 * 8) + stopDegree; 
            
            // Cộng dồn vòng quay để không bị giật lùi
            currentRotation += totalSpin - (currentRotation % 360) + (stopDegree < (currentRotation % 360) ? 360 : 0);
            
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                showModal(prizes[prizeIndex].name);
            }, 5000);
        }

        function showModal(name) {
            document.getElementById('prize-text').innerHTML = "Bạn đã may mắn nhận được:<br><b style='color:#ffcc00; font-size:20px;'>" + name + "</b>";
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
