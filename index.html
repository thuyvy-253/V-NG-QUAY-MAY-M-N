<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Cổng Trời Đông Giang</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background-color: #014321;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Container co giãn theo chiều cao màn hình để không bị tràn */
        .poster-container {
            position: relative;
            height: 98vh; 
            width: auto;
            aspect-ratio: 1 / 2; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-img {
            height: 100%; 
            width: auto;
            display: block;
            z-index: 1;
        }

        /* --- VÒNG XOAY (Đã nhích xuống 63.2% để cân đối hơn) --- */
        .wheel-area {
            position: absolute;
            top: 63.2%; 
            left: 50%;
            width: 89.2%; 
            transform: translate(-50%, -50%);
            z-index: 2;
            line-height: 0;
        }

        .wheel-img {
            width: 100%;
            height: auto;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .start-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32%; 
            cursor: pointer;
            z-index: 10;
        }

        /* --- BẢNG CHÚC MỪNG NỀN TRẮNG (MODAL) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #ffffff; /* Nền trắng như ảnh bạn gửi */
            width: 88%;
            max-width: 380px;
            padding: 35px 20px 30px;
            border-radius: 25px;
            text-align: center;
            position: relative; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }

        /* NÚT ĐÓNG (X) */
        .close-x {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 26px;
            color: #aaa;
            cursor: pointer;
            line-height: 1;
            font-weight: bold;
        }
        .close-x:hover { color: #333; }

        .modal-content h2 { 
            color: #d42020; 
            margin: 0; 
            font-size: 24px; 
            font-weight: 900;
            text-transform: uppercase;
        }

        .modal-content p { 
            color: #555;
            font-size: 18px; 
            margin: 20px 0; 
            line-height: 1.6; 
        }

        .modal-content b {
            color: #333;
            font-size: 21px;
            display: block;
            margin-top: 5px;
        }

        /* NÚT ZALO XANH LÁ NHẠT NHƯ HÌNH */
        .zalo-btn {
            display: inline-block;
            background-color: #c2f0c2; 
            color: #004d26;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 5px;
            border: 1px solid #a8e0a8;
            transition: 0.2s;
        }
        .zalo-btn:hover { background-color: #b0eeb0; }

        .out-of-turns { filter: grayscale(1); cursor: not-allowed !important; }
    </style>
</head>
<body>

    <div class="poster-container">
        <img src="nen-back.jpg" class="bg-img">
        <div class="wheel-area">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <img src="nut-quay.png" class="start-btn" id="spin-button" onclick="startSpin()">
        </div>
    </div>

    <!-- Hộp thông báo nền trắng -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeModal()">&times;</span>
            <h2>CỔNG TRỜI ĐÔNG GIANG</h2>
            <p id="prize-text"></p>
            <!-- Thay số điện thoại Zalo của bạn vào đây -->
            <a href="https://zalo.me/1049758536530278164" target="_blank" class="zalo-btn">LIÊN HỆ ZALO NHẬN QUÀ</a>
        </div>
    </div>

    <script>
        let isSpinning = false;
        let currentRotation = 0;
        
        // Giới hạn 2 lượt quay
        let spinCount = parseInt(localStorage.getItem('spin_count_donggiang')) || 0;
        if (spinCount >= 2) {
            document.getElementById('spin-button').classList.add('out-of-turns');
        }

        const prizes = [
            { name: "TÚI VẢI ĐÔNG GIANG 👜" },           
            { name: "VOUCHER MIỄN PHÍ VÉ THAM QUAN 🎫" }, 
            { name: "TÚI CÓI ĐÔNG GIANG 🧺" },           
            { name: "STICKER CỔNG TRỜI ĐÔNG GIANG 🌟" }, 
            { name: "VOUCHER GIẢM 100K 💸" },            
            { name: "QUẠT CẦM TAY XINH XẮN 🪭" }         
        ];

        function startSpin() {
            if (isSpinning) return;
            if (spinCount >= 2) {
                alert("Bạn đã hết lượt quay! Mỗi thiết bị chỉ được tối đa 2 lượt.");
                return;
            }

            isSpinning = true;

            // Tính quà tặng ngẫu nhiên
            let prizeIndex = Math.floor(Math.random() * prizes.length);

            // Tính góc quay dừng ở vị trí 3 giờ (Bên phải)
            let stopDegree = 90 - (prizeIndex * 60) - 30;
            let totalSpin = (360 * 10) + stopDegree; 
            currentRotation += totalSpin - (currentRotation % 360) + (stopDegree < (currentRotation % 360) ? 360 : 0);
            
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinCount++;
                localStorage.setItem('spin_count_donggiang', spinCount);
                
                if (spinCount >= 2) {
                    document.getElementById('spin-button').classList.add('out-of-turns');
                }

                showModal(prizes[prizeIndex].name);
            }, 5200);
        }

        function showModal(name) {
            document.getElementById('prize-text').innerHTML = "Chúc mừng bạn đã nhận được:<b>" + name + "</b>";
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('modal')) {
                closeModal();
            }
        }
    </script>
</body>
</html>
