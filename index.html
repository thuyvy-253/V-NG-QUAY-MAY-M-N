<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Cổng Trời Đông Giang</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #004d26; 
            font-family: sans-serif;
        }

        .poster-container {
            position: relative;
            width: 100%;
            max-width: 500px; /* Tối ưu cho điện thoại */
            line-height: 0;
        }

        /* 1. ẢNH NỀN POSTER */
        .bg-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 2. KHU VỰC VÒNG XOAY */
        .wheel-area {
            position: absolute;
            top: 61.2%; /* Vị trí vòng tròn trên poster */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72%; /* Độ lớn vòng xoay */
            z-index: 2;
        }

        .wheel-img {
            width: 100%;
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
            display: block;
        }

        /* 3. NÚT START */
        .start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25%; 
            cursor: pointer;
            z-index: 10;
            transition: transform 0.1s;
        }

        .start-btn:active {
            transform: translate(-50%, -50%) scale(0.9);
        }

        /* Kết quả hiện ra dưới chân poster */
        #status {
            position: absolute;
            bottom: 5%;
            width: 100%;
            text-align: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Tên file ảnh nền của bạn -->
        <img src="nen-back.jpg" class="bg-img">

        <div class="wheel-area">
            <!-- Tên file vòng xoay của bạn -->
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            
            <!-- Tên file nút quay của bạn -->
            <img src="nut-quay.png" class="start-btn" onclick="startSpin()">
        </div>

        <div id="status"></div>
    </div>

    <script>
        let isSpinning = false;
        let currentRotation = 0;
        
        // Danh sách quà theo thứ tự vòng tròn của bạn
        const prizes = [
            "Túi Vải", 
            "Voucher Miễn Phí Vé Tham Quan", 
            "Túi Cói", 
            "Sticker Cổng Trời", 
            "Voucher Giảm 100K", 
            "Quạt Cầm Tay"
        ];

        function startSpin() {
            if (isSpinning) return;
            
            isSpinning = true;
            document.getElementById('status').innerText = "Đang quay...";
            
            // Quay ngẫu nhiên
            const randomDegree = Math.floor(Math.random() * 360);
            const totalSpin = 1800 + randomDegree; 
            currentRotation += totalSpin;
            
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                
                // Tính kết quả dựa trên góc dừng
                const actualDegree = currentRotation % 360;
                const prizeIndex = Math.floor(((360 - actualDegree) % 360) / 60);
                
                const gift = prizes[prizeIndex];
                document.getElementById('status').innerHTML = "CHÚC MỪNG BẠN!<br>Phần quà: " + gift;
                
                // Hiện thông báo popup
                alert("Chúc mừng! Bạn đã trúng: " + gift);
            }, 5200);
        }
    </script>
</body>
</html>
