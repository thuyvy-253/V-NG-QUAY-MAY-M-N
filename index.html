<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vòng Quay May Mắn - Cổng Trời Đông Giang</title>
    <style>
        /* PHÔNG CHỮ HỆ THỐNG: Sắc nét, không lỗi phông */
        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; height: 100dvh; 
            background-color: #014321;
            overflow: hidden;
        }

        /* Container giữ Poster luôn cân đối giữa màn hình */
        .poster-container {
            position: relative;
            height: 100%;
            max-height: 100dvh;
            width: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-img {
            max-height: 100%;
            max-width: 100vw;
            width: auto;
            height: auto;
            display: block;
            z-index: 1;
            object-fit: contain;
        }

        /* --- VÒNG XOAY: VI CHỈNH XUỐNG 61.8% ĐỂ KHỚP TÂM 100% --- */
        .wheel-area {
            position: absolute;
            top: 61.5%; /* Tọa độ đã được tinh chỉnh để khớp tâm hoàn toàn */
            left: 50%;
            width: 88.8%; /* Độ nở để khít hàng bóng đèn LED vàng */
            transform: translate(-50%, -50%);
            z-index: 2;
            line-height: 0;
        }

        .wheel-img {
            width: 100%;
            height: auto;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .start-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32.5%; 
            cursor: pointer;
            z-index: 10;
        }

        /* --- MODAL CHÚC MỪNG NỀN TRẮNG --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #ffffff;
            width: 88%;
            max-width: 360px;
            padding: 35px 20px;
            border-radius: 20px;
            text-align: center;
            position: relative; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s ease-out;
        }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }

        .close-x {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 28px; color: #ccc;
            cursor: pointer; font-weight: bold;
        }

        .modal-content h2 { color: #d42020; margin: 0; font-size: 22px; font-weight: 800; text-transform: uppercase; }
        .modal-content p { color: #333; font-size: 17px; margin: 20px 0 10px; line-height: 1.4; }
        .modal-content b { color: #000; font-size: 20px; display: block; margin-bottom: 25px; font-weight: 700; }

        .zalo-btn {
            display: inline-block;
            background-color: #c2f0c2; 
            color: #004d26;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase;
            border: 1px solid #a8e0a8;
        }

        .out-of-turns { filter: grayscale(1); cursor: not-allowed !important; }
    </style>
</head>
<body>

    <div class="poster-container">
        <img src="nen-back.jpg" class="bg-img" id="poster">
        <div class="wheel-area" id="wheel-box">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <img src="nut-quay.png" class="start-btn" id="spin-button" onclick="startSpin()">
        </div>
    </div>

    <!-- Popup kết quả -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeModal()">&times;</span>
            <h2>CỔNG TRỜI ĐÔNG GIANG</h2>
            <p>Chúc mừng bạn đã nhận được:</p>
            <b id="prize-name"></b>
            <!-- Đổi SỐ_ĐIỆN_THOẠI thành số của bạn -->
            <a href="https://zalo.me/YOUR_PHONE_NUMBER" target="_blank" class="zalo-btn">LIÊN HỆ ZALO NHẬN QUÀ</a>
        </div>
    </div>

    <script>
        let isSpinning = false;
        let currentRotation = 0;
        
        // Ghi nhớ 2 lượt quay
        let spinCount = parseInt(localStorage.getItem('spin_dg_final_v11')) || 0;
        if (spinCount >= 2) {
            document.getElementById('spin-button').classList.add('out-of-turns');
        }

        const prizes = [
            { name: "TÚI VẢI" },           
            { name: "VOUCHER MIỄN PHÍ VÉ THAM QUAN" }, 
            { name: "TÚI CÓI" },           
            { name: "STICKER" }, 
            { name: "VOUCHER GIẢM 100K" },            
            { name: "QUẠT" }         
        ];

        // Tự động căn chỉnh chiều rộng vòng xoay theo kích thước Poster thực tế
        function adjustWheel() {
            const poster = document.getElementById('poster');
            const wheelBox = document.getElementById('wheel-box');
            if (poster.complete) {
                wheelBox.style.width = (poster.clientWidth * 0.888) + "px";
            }
        }
        window.addEventListener('resize', adjustWheel);
        document.getElementById('poster').addEventListener('load', adjustWheel);

        function startSpin() {
            if (isSpinning) return;
            if (spinCount >= 2) {
                alert("Bạn đã tham gia đủ 2 lượt quay!");
                return;
            }

            isSpinning = true;
            let prizeIndex = Math.floor(Math.random() * prizes.length);

            // Tính góc dừng ở vị trí mũi tên bên phải (3 giờ)
            let stopDegree = 90 - (prizeIndex * 60) - 30;
            let totalSpin = (360 * 10) + stopDegree; 
            currentRotation += totalSpin - (currentRotation % 360) + (stopDegree < (currentRotation % 360) ? 360 : 0);
            
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinCount++;
                localStorage.setItem('spin_count_dg_v11', spinCount);
                if (spinCount >= 2) document.getElementById('spin-button').classList.add('out-of-turns');
                showModal(prizes[prizeIndex].name);
            }, 5200);
        }

        function showModal(name) {
            document.getElementById('prize-name').innerText = name;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
