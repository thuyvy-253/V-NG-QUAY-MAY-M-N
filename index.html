<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Cổng Trời Đông Giang</title>
    <style>
        /* SỬA LỖI PHÔNG: Sử dụng bộ font hệ thống hỗ trợ tiếng Việt tốt nhất */
        * { 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background-color: #014321;
            overflow: hidden;
        }

        /* Container co giãn theo màn hình */
        .poster-container {
            position: relative;
            height: 98vh; 
            width: auto;
            aspect-ratio: 1 / 2; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-img {
            height: 100%; 
            width: auto;
            display: block;
            z-index: 1;
        }

        /* --- VÒNG XOAY (Đã nhích xuống 63.5% để cực cân) --- */
        .wheel-area {
            position: absolute;
            top: 63.5%; 
            left: 50%;
            width: 89.2%; 
            transform: translate(-50%, -50%);
            z-index: 2;
            line-height: 0;
        }

        .wheel-img {
            width: 100%;
            height: auto;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .start-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32%; 
            cursor: pointer;
            z-index: 10;
        }

        /* --- BẢNG CHÚC MỪNG NỀN TRẮNG (Ảnh 2 của bạn) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #ffffff;
            width: 88%;
            max-width: 380px;
            padding: 40px 20px;
            border-radius: 30px;
            text-align: center;
            position: relative; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown { 
            from { opacity: 0; transform: translateY(-30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* NÚT ĐÓNG (X) */
        .close-x {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            color: #bbb;
            cursor: pointer;
            line-height: 1;
            font-weight: bold;
        }
        .close-x:hover { color: #d42020; }

        .modal-content h2 { 
            color: #d42020; 
            margin: 0; 
            font-size: 26px; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-content p { 
            color: #555;
            font-size: 19px; 
            margin: 25px 0 10px; 
            line-height: 1.4; 
        }

        .modal-content b {
            color: #222;
            font-size: 22px;
            display: block;
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* NÚT ZALO XANH LÁ NHẠT */
        .zalo-btn {
            display: inline-block;
            background-color: #bdf0bd; 
            color: #004d26;
            text-decoration: none;
            padding: 16px 35px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            border: 1px solid #a8e0a8;
        }

        .out-of-turns { filter: grayscale(1); cursor: not-allowed !important; }
    </style>
</head>
<body>

    <div class="poster-container">
        <img src="nen-back.jpg" class="bg-img">
        <div class="wheel-area">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <img src="nut-quay.png" class="start-btn" id="spin-button" onclick="startSpin()">
        </div>
    </div>

    <!-- Hộp thông báo đã sửa lỗi phông -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeModal()">&times;</span>
            <h2>CỔNG TRỜI ĐÔNG GIANG</h2>
            <p id="prize-intro">Chúc mừng bạn đã nhận được:</p>
            <b id="prize-name"></b>
            <!-- Nhớ thay số điện thoại Zalo của bạn -->
            <a href="https://zalo.me/1049758536530278164" target="_blank" class="zalo-btn">LIÊN HỆ ZALO NHẬN QUÀ</a>
        </div>
    </div>

    <script>
        let isSpinning = false;
        let currentRotation = 0;
        
        // Ghi nhớ lượt quay (Giới hạn 2 lượt)
        let spinCount = parseInt(localStorage.getItem('spin_count_dg_v3')) || 0;
        if (spinCount >= 2) {
            document.getElementById('spin-button').classList.add('out-of-turns');
        }

        const prizes = [
            { name: "TÚI VẢI ĐÔNG GIANG " },           
            { name: "VOUCHER MIỄN PHÍ VÉ THAM QUAN " }, 
            { name: "TÚI CÓI ĐÔNG GIANG " },           
            { name: "STICKER CỔNG TRỜI ĐÔNG GIANG " }, 
            { name: "VOUCHER GIẢM 100K " },            
            { name: "QUẠT CẦM TAY XINH XẮN " }         
        ];

        function startSpin() {
            if (isSpinning) return;
            if (spinCount >= 2) {
                alert("Bạn đã tham gia đủ 2 lượt quay may mắn!");
                return;
            }

            isSpinning = true;
            let prizeIndex = Math.floor(Math.random() * prizes.length);

            // Tính góc quay dừng ở bên Phải (3 giờ)
            let stopDegree = 90 - (prizeIndex * 60) - 30;
            let totalSpin = (360 * 10) + stopDegree; 
            currentRotation += totalSpin - (currentRotation % 360) + (stopDegree < (currentRotation % 360) ? 360 : 0);
            
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinCount++;
                localStorage.setItem('spin_count_dg_v3', spinCount);
                
                if (spinCount >= 2) {
                    document.getElementById('spin-button').classList.add('out-of-turns');
                }

                showModal(prizes[prizeIndex].name);
            }, 5200);
        }

        function showModal(name) {
            document.getElementById('prize-name').innerText = name;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('modal')) {
                closeModal();
            }
        }
    </script>
</body>
</html>
