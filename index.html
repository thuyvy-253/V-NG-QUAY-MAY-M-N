<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Cổng Trời Đông Giang</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #014321;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .poster-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: auto;
            line-height: 0;
        }

        .bg-img { width: 100%; height: auto; display: block; z-index: 1; }

        /* --- CĂN CHỈNH VÒNG XOAY (UPDATE MỚI NHẤT) --- */
        .wheel-area {
            position: absolute;
            top: 61.25%; /* Nhích xuống một chút cho cân tâm */
            left: 50%;
            width: 88%;  /* Tăng lên 88% để khít hoàn toàn viền vàng */
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .wheel-img {
            width: 100%;
            height: auto;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
            display: block;
        }

        /* Nút START có mũi tên hướng sang PHẢI */
        .start-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32%; /* Tăng độ to nút bấm cho khớp */
            cursor: pointer;
            z-index: 10;
        }

        /* --- POPUP CHÚC MỪNG --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            width: 80%;
            max-width: 320px;
            padding: 30px 20px;
            border-radius: 20px;
            border: 5px solid #ffd700;
            text-align: center;
            box-shadow: 0 0 30px #ffd700;
            animation: popup 0.5s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        @keyframes popup { from { transform: scale(0); } to { transform: scale(1); } }
        .modal-content h2 { color: #d42020; margin: 0; font-size: 22px; }
        .modal-content p { color: #333; font-size: 18px; margin: 15px 0 25px; font-weight: bold; line-height: 1.4; }
        .close-btn {
            background: linear-gradient(180deg, #ffcc00, #f39200);
            color: white; border: none; padding: 12px 30px; border-radius: 50px;
            font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <img src="nen-back.jpg" class="bg-img">
        <div class="wheel-area">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <img src="nut-quay.png" class="start-btn" onclick="startSpin()">
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2>XIN CHÚC MỪNG!</h2>
            <p id="prize-text"></p>
            <button class="close-btn" onclick="closeModal()">Nhận quà ngay</button>
        </div>
    </div>

    <script>
        let isSpinning = false;
        let currentRotation = 0;
        
        // DANH SÁCH QUÀ THEO THỨ TỰ TRÊN HÌNH (Tính từ đỉnh 12h xuôi chiều kim đồng hồ)
        const prizes = [
            { name: "Túi Vải Cổng Trời 👜", weight: 20 },      // Index 0: Đỉnh (12h)
            { name: "Voucher Miễn Phí Vé Tham Quan 🎫", weight: 15 }, // Index 1: 2h sáng
            { name: "Túi Cói Đông Giang 🧺", weight: 10 },    // Index 2: 4h chiều
            { name: "Sticker Cổng Trời 🌟", weight: 20 },     // Index 3: 6h tối
            { name: "Voucher Giảm 100K 💸", weight: 15 },     // Index 4: 8h tối
            { name: "Quạt Cầm Tay Xinh Xắn 🪭", weight: 20 }    // Index 5: 10h đêm
        ];

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;

            // 1. Chọn quà theo tỉ lệ %
            let random = Math.floor(Math.random() * 100);
            let cumulativeWeight = 0;
            let prizeIndex = 0;
            for (let i = 0; i < prizes.length; i++) {
                cumulativeWeight += prizes[i].weight;
                if (random < cumulativeWeight) { prizeIndex = i; break; }
            }

            // 2. TÍNH GÓC QUAY CHÍNH XÁC CHO MŨI TÊN BÊN PHẢI (90 ĐỘ)
            // Mỗi ô 60 độ. Mũi tên ở vị trí 90 độ (bên phải).
            // Công thức: 90 độ (vị trí mũi tên) - (số thứ tự ô * 60 độ) - 30 độ (để vào giữa ô)
            let stopDegree = 90 - (prizeIndex * 60) - 30;
            
            // Quay ít nhất 7 vòng để tạo cảm giác nhanh mạnh
            let totalSpin = 2520 + stopDegree; 
            currentRotation += totalSpin - (currentRotation % 360) + 360; 
            
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                showModal(prizes[prizeIndex].name);
            }, 5000);
        }

        function showModal(name) {
            document.getElementById('prize-text').innerHTML = "Chúc mừng bạn nhận được:<br><span style='color:#f39200;'>" + name + "</span>";
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
