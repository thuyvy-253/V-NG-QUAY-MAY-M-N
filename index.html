<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Cổng Trời Đông Giang</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #014321;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .poster-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: auto;
            line-height: 0;
        }

        .bg-img { width: 100%; height: auto; display: block; z-index: 1; }

        /* --- CĂN CHỈNH VỊ TRÍ VÒNG XOAY CHUẨN XÁC --- */
        .wheel-area {
            position: absolute;
            top: 61.38%; /* Vị trí tâm dọc đã tinh chỉnh */
            left: 50%;
            width: 89%;   /* Độ rộng đã tăng để khít viền vàng */
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .wheel-img {
            width: 100%;
            height: auto;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
            display: block;
        }

        .start-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32%; 
            cursor: pointer;
            z-index: 10;
        }

        /* --- THÔNG BÁO CHÚC MỪNG (MODAL NHƯ ẢNH 2) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #1a1a1a; /* Nền tối sang trọng */
            width: 85%;
            max-width: 350px;
            padding: 30px 20px;
            border-radius: 20px;
            border: 2px solid #ffcc00;
            text-align: center;
            color: white;
            box-shadow: 0 0 25px #ffcc00;
            animation: popup 0.4s ease-out;
        }

        @keyframes popup { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-content h2 { color: #ff4d4d; margin: 0; font-size: 24px; text-transform: uppercase; }
        .modal-content p { font-size: 18px; margin: 20px 0; line-height: 1.5; }
        
        /* NÚT ZALO MÀU XANH LÁ NHẠT */
        .zalo-btn {
            display: inline-block;
            background-color: #a2e0a2; /* Xanh lá nhạt */
            color: #004d26; 
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(162, 224, 162, 0.4);
            transition: 0.3s;
        }
        .zalo-btn:hover { background-color: #8cd18c; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="poster-container">
        <img src="nen-back.jpg" class="bg-img">
        <div class="wheel-area">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <img src="nut-quay.png" class="start-btn" onclick="startSpin()">
        </div>
    </div>

    <!-- HỘP THÔNG BÁO TÙY CHỈNH -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2>XIN CHÚC MỪNG!</h2>
            <p id="prize-text"></p>
            <!-- THAY LINK ZALO CỦA BẠN VÀO CHỖ # DƯỚI ĐÂY -->
            <a href="https://zalo.me/SỐ_ĐIỆN_THOẠI_CỦA_BẠN" target="_blank" class="zalo-btn" id="zalo-link">LIÊN HỆ ZALO NHẬN QUÀ</a>
        </div>
    </div>

    <script>
        let isSpinning = false;
        let currentRotation = 0;
        
        // DANH SÁCH QUÀ (Khớp 100% với hình ảnh từ đỉnh 12h đi theo chiều kim đồng hồ)
        const prizes = [
            { name: "TÚI VẢI ĐÔNG GIANG 👜", weight: 20 },           // Ô 1
            { name: "VOUCHER MIỄN PHÍ VÉ THAM QUAN 🎫", weight: 15 }, // Ô 2
            { name: "TÚI CÓI ĐÔNG GIANG 🧺", weight: 10 },           // Ô 3
            { name: "STICKER CỔNG TRỜI ĐÔNG GIANG 🌟", weight: 20 }, // Ô 4
            { name: "VOUCHER GIẢM 100K 💸", weight: 15 },            // Ô 5
            { name: "QUẠT CẦM TAY XINH XẮN 🪭", weight: 20 }         // Ô 6
        ];

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;

            // 1. Thuật toán tỉ lệ trúng
            let random = Math.floor(Math.random() * 100);
            let cumulativeWeight = 0;
            let prizeIndex = 0;
            for (let i = 0; i < prizes.length; i++) {
                cumulativeWeight += prizes[i].weight;
                if (random < cumulativeWeight) { prizeIndex = i; break; }
            }

            // 2. TÍNH TOÁN GÓC QUAY CHO MŨI TÊN BÊN PHẢI (Vị trí 3 giờ)
            let stopDegree = 90 - (prizeIndex * 60) - 30;
            
            let totalSpin = (360 * 10) + stopDegree; 
            currentRotation += totalSpin - (currentRotation % 360) + (stopDegree < (currentRotation % 360) ? 360 : 0);
            
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                // Hiện bảng thông báo tùy chỉnh, không hiện Alert trình duyệt
                showModal(prizes[prizeIndex].name);
            }, 5200);
        }

        function showModal(name) {
            document.getElementById('prize-text').innerHTML = "Bạn đã may mắn nhận được:<br><b style='color:#ffcc00; font-size:20px;'>" + name + "</b><br>tại Cổng Trời Đông Giang";
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
