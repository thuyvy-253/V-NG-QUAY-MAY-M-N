<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Cổng Trời Đông Giang</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #004d26;
            font-family: sans-serif;
        }
        .poster-container {
            position: relative;
            width: 100%; max-width: 500px;
            line-height: 0;
        }
        .bg-img { width: 100%; height: auto; display: block; }

        .wheel-area {
            position: absolute;
            top: 61.2%; /* Nếu chưa khớp tâm, bạn hãy chỉnh số này (ví dụ 60% hoặc 62%) */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72%; /* Nếu vòng quay to/nhỏ quá, hãy chỉnh số này */
            z-index: 2;
        }
        .wheel-img { width: 100%; transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1); display: block; }

        .start-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 25%; cursor: pointer; z-index: 10;
        }
        #status {
            position: absolute; bottom: 5%; width: 100%;
            text-align: center; color: #fff; font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <!-- ĐÚNG TÊN FILE TRÊN GITHUB CỦA BẠN -->
        <img src="nen-back.jpg" class="bg-img">

        <div class="wheel-area">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <img src="nut-quay.png" class="start-btn" onclick="startSpin()">
        </div>
        <div id="status"></div>
    </div>

    <script>
        let isSpinning = false;
        let currentRotation = 0;
        const prizes = ["Túi Vải", "Voucher Miễn Phí", "Túi Cói", "Sticker", "Voucher 100K", "Quạt Cầm Tay"];

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('status').innerText = "Đang quay...";
            const randomDegree = Math.floor(Math.random() * 360);
            currentRotation += (1800 + randomDegree);
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const actualDegree = currentRotation % 360;
                const prizeIndex = Math.floor(((360 - actualDegree) % 360) / 60);
                alert("Chúc mừng! Bạn đã trúng: " + prizes[prizeIndex]);
                document.getElementById('status').innerText = "Kết quả: " + prizes[prizeIndex];
            }, 5200);
        }
    </script>
</body>
</html>
